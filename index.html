<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Paper World</title>
<meta name="description" content="Conquiste países pintando território. Jogo de navegador sem anúncios.">
<meta name="theme-color" content="#1677ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect x=%278%27 y=%2712%27 width=%2748%27 height=%2746%27 rx=%2712%27 fill=%27%231e40af%27/%3E%3Crect x=%278%27 y=%276%27 width=%2748%27 height=%2746%27 rx=%2712%27 fill=%27%233b82f6%27/%3E%3Ccircle cx=%2724%27 cy=%2730%27 r=%277%27 fill=%27white%27/%3E%3Ccircle cx=%2740%27 cy=%2730%27 r=%277%27 fill=%27white%27/%3E%3Ccircle cx=%2725%27 cy=%2732%27 r=%273.5%27 fill=%27%231d2b53%27/%3E%3Ccircle cx=%2741%27 cy=%2732%27 r=%273.5%27 fill=%27%231d2b53%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD da partida -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <button id="pauseBtn" class="icon-btn small" aria-label="Pausar"><span class="pause-ico"></span></button>
    <div class="pbar">
      <div class="pfill" id="pfill"></div>
      <div class="pbest" id="pbest"><span>MELHOR</span></div>
      <span class="ptext" id="ptext">0%</span>
    </div>
  </div>
  <div class="kills"><span class="skull">☠</span><span id="killsTxt">0</span></div>
  <ol id="board"></ol>
  <canvas id="minimap"></canvas>
</div>
<div id="combo"></div>
<div id="toast"></div>

<!-- Menu principal -->
<div id="menu" class="screen">
  <div class="bubbles"></div>
  <div class="mtop">
    <div class="coins"><span class="coin"></span><span id="coinTxt">0</span></div>
    <button id="settingsBtn" class="icon-btn" aria-label="Configurações">⚙</button>
  </div>
  <h1 class="logo">Paper<span>World</span></h1>
  <div class="country-card">
    <button class="arrow" id="prevC" aria-label="País anterior">‹</button>
    <div class="cc-body">
      <div class="cc-name"><span id="cFlag"></span> <span id="cName"></span></div>
      <div class="cc-bar"><div id="cBar"></div><span id="cPct"></span></div>
      <canvas id="cShape" width="440" height="360"></canvas>
      <div class="cc-lock hidden" id="cLock"></div>
    </div>
    <button class="arrow" id="nextC" aria-label="Próximo país">›</button>
  </div>
  <div class="level-info" id="levelInfo"></div>
  <button id="playBtn" class="play" aria-label="Jogar"><span></span></button>
  <div class="mbottom">
    <button id="skinsBtn" class="pill">🎨 Skins</button>
    <button id="mapBtn" class="pill">🌍 Países</button>
  </div>
</div>

<!-- Skins -->
<div id="skins" class="screen hidden">
  <div class="bubbles"></div>
  <div class="mtop">
    <button class="icon-btn back" data-back>‹</button>
    <h2>Skins</h2>
    <div class="coins"><span class="coin"></span><span class="coinTxt2">0</span></div>
  </div>
  <div class="grid" id="skinGrid"></div>
</div>

<!-- Países -->
<div id="countries" class="screen hidden">
  <div class="bubbles"></div>
  <div class="mtop">
    <button class="icon-btn back" data-back>‹</button>
    <h2>Países</h2>
    <div class="world-pct" id="worldPct"></div>
  </div>
  <div class="grid" id="countryGrid"></div>
</div>

<!-- Configurações -->
<div id="settings" class="modal hidden">
  <div class="card">
    <h2>Configurações</h2>
    <label class="field">Seu nome<input id="nameInput" maxlength="12" autocomplete="off"></label>
    <label class="toggle"><input type="checkbox" id="soundToggle"> <span>Som</span></label>
    <button id="resetBtn" class="btn ghost">Apagar progresso</button>
    <button class="btn" id="closeSettings">Pronto</button>
    <p class="tiny">Feito para rodar no GitHub Pages. Sem anúncios.</p>
  </div>
</div>

<!-- Pausa -->
<div id="pause" class="modal hidden">
  <div class="card">
    <h2>Pausado</h2>
    <button class="btn" id="resumeBtn">Continuar</button>
    <button class="btn ghost" id="quitBtn">Sair para o menu</button>
  </div>
</div>

<!-- Fim de partida -->
<div id="over" class="modal hidden">
  <div class="card">
    <h2 id="overTitle">Fim de jogo</h2>
    <p class="cause" id="overCause"></p>
    <div class="stats">
      <div><b id="stPct">0%</b><span>território</span></div>
      <div><b id="stKills">0</b><span>abates</span></div>
      <div><b id="stCoins">+0</b><span>moedas</span></div>
    </div>
    <div class="over-country">
      <div><span id="ovFlag"></span> <span id="ovName"></span> <span id="ovPct"></span></div>
      <div class="cc-bar"><div id="ovBar"></div></div>
      <p class="tiny" id="ovNote"></p>
    </div>
    <button class="btn big" id="againBtn">Jogar de novo</button>
    <button class="btn ghost" id="menuBtn">Menu</button>
  </div>
</div>

<script src="countries.js"></script>
<script src="game.js"></script>
</body>
</html>
